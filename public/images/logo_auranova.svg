<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="auraCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <linearGradient id="auraGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="prismCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#7928CA" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0A0D18" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="120" cy="120" r="90" fill="url(#prismCore)" filter="url(#neonBlur)" opacity="0.75" />

  <!-- Outer Quantum Ring -->
  <circle cx="120" cy="120" r="88" fill="none" stroke="url(#auraCyanPurple)" stroke-width="3" stroke-dasharray="14 8" opacity="0.85" />
  <circle cx="120" cy="120" r="96" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="4 16" opacity="0.6" />

  <!-- Geometric Hexagonal Prism -->
  <polygon points="120,32 196,76 196,164 120,208 44,164 44,76" fill="#0A0D18" stroke="url(#auraCyanPurple)" stroke-width="4" filter="drop-shadow(0 0 14px rgba(0, 242, 254, 0.6))" />

  <!-- Inner Dynamic Crystal Facets -->
  <polygon points="120,32 120,120 44,76" fill="url(#auraCyanPurple)" opacity="0.35" />
  <polygon points="120,32 196,76 120,120" fill="url(#auraGlow)" opacity="0.45" />
  <polygon points="196,76 196,164 120,120" fill="url(#auraCyanPurple)" opacity="0.6" />
  <polygon points="196,164 120,208 120,120" fill="url(#auraGlow)" opacity="0.3" />
  <polygon points="120,208 44,164 120,120" fill="url(#auraCyanPurple)" opacity="0.5" />
  <polygon points="44,164 44,76 120,120" fill="url(#auraGlow)" opacity="0.4" />

  <!-- Center Play/Cinema Spark -->
  <polygon points="106,94 148,120 106,146" fill="#FFFFFF" filter="drop-shadow(0 0 8px #00F2FE)" />
  <circle cx="120" cy="120" r="4" fill="#00F2FE" />
</svg>
